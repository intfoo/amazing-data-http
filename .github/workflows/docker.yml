name: Build and Push Docker Image

# 触发:
#   - push 到 main: 覆盖刷新 :latest + :sha(每次提交可追溯)
#   - 打 v* tag:    额外产出带版本号的镜像(如 :v0.1.43), 便于固定回溯
#   - 手动:         网页 Actions → Run workflow
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=match,pattern=v*,group=0

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          # 本地/国内手动 docker build 仍走 Dockerfile 默认的 CN 镜像。
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ==========  SSH 部署到服务器 ==========
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            # 1. 开启严格模式：遇到错误立即退出，防止 pull 失败仍执行 up
            set -e
            set -o pipefail

            cd /app/${{ github.repository }}

            echo "::group::🛑 2. 停止并清理旧服务"
            # --remove-orphans 清理 compose 文件中已删除的服务
            podman-compose down --remove-orphans || true
            echo "::endgroup::"

            echo "::group::📦 3. 拉取最新镜像"
            podman-compose pull
            echo "::endgroup::"

            echo "::group::🚀 4. 启动新服务"
            podman-compose up -d --remove-orphans
            echo "::endgroup::"

            echo "::group::🧹 5. 清理悬空镜像 (释放磁盘空间)"
            # 每次 pull 新镜像后，旧镜像会变成 <none>，定期清理防止磁盘爆满
            podman image prune -f
            echo "::endgroup::"

            echo "::group::📊 6. 验证部署状态"
            # 等待容器完全启动（特别是数据库等需要初始化的服务）
            sleep 10
            
            echo ""
            echo "=== Compose 服务状态 ==="
            podman-compose ps
            
            echo ""
            echo "=== 最近 20 行日志 ==="
            podman-compose logs --tail=20
            echo "::endgroup::"

            echo "✅ 部署脚本执行完毕！"
