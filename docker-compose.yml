services:
  amazingdata-http:
    container_name: amazing-data-http
    image: amazing-data-http:latest
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    # 端口映射：宿主机端口:容器内端口，均读取 HTTP_PORT（默认 3021）。
    # Dockerfile CMD 已读取 HTTP_HOST/HTTP_PORT，二者保持一致。
    ports:
      - "${HTTP_PORT:-3021}:${HTTP_PORT:-3021}"
    env_file:
      - .env
    volumes:
      # 复权因子缓存基目录：SDK get_adj_factor 的 local_path 缓存。
      # SDK 内部用字符串拼接 local_path + 'basedata/adj_factor/' 构造缓存路径（非 os.path.join），
      # 因此挂载整个 data 目录而非 data/adj_factor，确保 SDK 自建的 basedata/adj_factor/ 子目录持久化。
      - ./data:/app/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2g
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:${HTTP_PORT:-3021}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
