services:
  amazingdata-http:
    container_name: amazing-data-http
    image: amazing-data-http:latest
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    # 端口映射：宿主机端口:容器内端口，均读取 HTTP_PORT（默认 3021）。
    # Dockerfile CMD 已读取 HTTP_HOST/HTTP_PORT，二者保持一致。
    ports:
      - "${HTTP_PORT:-3021}:${HTTP_PORT:-3021}"
    env_file:
      - .env
    volumes:
      # 复权因子缓存目录：SDK get_adj_factor 的 local_path 缓存，
      - ./data/adj_factor:/app/data/adj_factor
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2g
    healthcheck:
      test: python -c "import urllib.request; urllib.request.urlopen('http://localhost:${HTTP_PORT:-3021}/health')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
