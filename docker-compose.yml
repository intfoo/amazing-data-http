version: "3.8"

services:
  amazingdata-http:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    ports:
      - "3021:3021"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3021/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
