[project]
name = "amazingdata-http"
version = "0.1.0"
description = "AmazingData HTTP adapter service"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "numpy>=2.0",
    "tables>=3.11.1",
    "tzdata>=2024.1",  # Windows 本地运行 zoneinfo 需要；pandas 已间接依赖，此处显式声明
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
